<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบตรวจสอบการส่งงานนักเรียน</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-graduation-cap text-3xl text-yellow-300"></i>
                <div>
                    <h1 class="text-xl font-bold">ระบบตรวจสอบการส่งงานนักเรียน</h1>
                    <p class="text-xs text-indigo-200" id="school-name-display">โรงเรียนยุวพุทธิศึกษาอุปถัมภ์</p>
                </div>
            </div>
            <span class="bg-indigo-800 px-3 py-1.5 rounded-xl text-xs font-semibold text-indigo-200 flex items-center gap-1.5">
                <i class="fa-solid fa-user-graduate text-yellow-300"></i> สำหรับนักเรียน
            </span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">
        <section class="space-y-6">
            <div class="bg-white p-6 md:p-8 rounded-2xl shadow-sm border border-slate-200 text-center max-w-xl mx-auto">
                <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                    <i class="fa-solid fa-magnifying-glass-chart"></i>
                </div>
                <h2 class="text-2xl font-bold text-slate-800 mb-2">ค้นหาภาระงานและสถานะการส่ง</h2>
                <p class="text-slate-500 mb-6 text-sm">กรอกรหัสประจำตัวนักเรียนของคุณเพื่อตรวจสอบการส่งงานและคะแนน</p>
                
                <div class="flex flex-col sm:flex-row gap-2">
                    <input type="text" id="student-search-id" placeholder="พิมพ์รหัสประจำตัว เช่น 1001" class="flex-1 border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-center text-lg font-semibold">
                    <button onclick="searchStudentWork()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-8 py-3 rounded-xl font-medium shadow transition flex items-center justify-center gap-2">
                        <i class="fa-solid fa-magnifying-glass"></i> ค้นหาข้อมูล
                    </button>
                </div>
            </div>

            <div id="student-result" class="hidden space-y-6">
                <div class="bg-gradient-to-r from-indigo-600 to-purple-600 text-white p-6 rounded-2xl shadow-md flex flex-col md:flex-row justify-between items-center gap-4">
                    <div>
                        <h3 class="text-2xl font-bold" id="res-student-name">-</h3>
                        <p class="text-indigo-100 text-sm mt-1">
                            รหัสประจำตัว: <span id="res-student-id" class="font-bold">-</span> | ชั้นเรียน: <span id="res-student-class" class="font-bold">-</span>
                        </p>
                    </div>
                    <div>
                        <span class="bg-white/20 px-4 py-2 rounded-xl text-sm font-semibold backdrop-blur-sm" id="res-student-summary">ส่งแล้ว 0/0 งาน</span>
                    </div>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
                    <div class="p-4 border-b bg-slate-50 font-bold text-slate-700 flex justify-between items-center">
                        <span class="text-sm md:text-base"><i class="fa-solid fa-list-check text-indigo-600 mr-2"></i>รายการภาระงานทั้งหมด</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="border-b text-slate-500 text-sm bg-slate-50">
                                    <th class="p-4 border-r border-slate-200">วิชา / ห้อง</th>
                                    <th class="p-4 border-r border-slate-200">ชื่องาน / รายละเอียด</th>
                                    <th class="p-4 text-center border-r border-slate-200">สถานะ</th>
                                </tr>
                            </thead>
                            <tbody id="student-work-table-body">
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        let store = {
            schoolName: localStorage.getItem('schoolName') || 'โรงเรียนยุวพุทธิศึกษาอุปถัมภ์',
            students: [],
            taskColumns: [],
            assignments: [],
            scriptUrl: localStorage.getItem('scriptUrl') || ''
        };

        window.onload = function() {
            document.getElementById('school-name-display').innerText = store.schoolName;
            fetchDataFromGAS();
        };

        function searchStudentWork() {
            const inputId = document.getElementById('student-search-id').value.trim();
            if (!inputId) return alert("กรุณากรอกรหัสประจำตัวนักเรียน");

            const student = store.students.find(s => s.studentId === inputId);
            if (!student) return alert("ไม่พบรหัสประจำตัวนักเรียนนี้ในระบบ");

            document.getElementById('res-student-name').innerText = student.name;
            document.getElementById('res-student-id').innerText = student.studentId;
            document.getElementById('res-student-class').innerText = student.className;

            const myCols = store.taskColumns.filter(c => c.className === student.className);
            const myWorks = store.assignments.filter(a => a.studentId === inputId);
            const submittedCount = myWorks.filter(w => w.status === 'submitted').length;

            document.getElementById('res-student-summary').innerText = `ส่งแล้ว ${submittedCount}/${myCols.length} งาน`;

            const tbody = document.getElementById('student-work-table-body');
            tbody.innerHTML = '';

            if (myCols.length === 0) {
                tbody.innerHTML = `<tr><td colspan="3" class="p-6 text-center text-slate-400">ยังไม่มีการมอบหมายงานในระบบ</td></tr>`;
            } else {
                myCols.forEach(col => {
                    let w = store.assignments.find(a => a.studentId === inputId && a.columnId === col.id);
                    let statusVal = w ? w.status : 'pending';

                    let statusBadge = statusVal === 'submitted' 
                        ? `<span class="bg-emerald-100 text-emerald-700 px-3 py-1 rounded-full text-xs font-semibold">✅ ส่งแล้ว</span>`
                        : statusVal === 'incomplete' 
                        ? `<span class="bg-amber-100 text-amber-700 px-3 py-1 rounded-full text-xs font-semibold">⚠️ งานไม่เรียบร้อย</span>`
                        : `<span class="bg-rose-100 text-rose-700 px-3 py-1 rounded-full text-xs font-semibold">❌ ยังไม่ส่ง</span>`;

                    tbody.innerHTML += `
                        <tr class="border-b hover:bg-slate-50 transition">
                            <td class="p-4 font-medium border-r border-slate-200">${col.subject} (${col.className})</td>
                            <td class="p-4 border-r border-slate-200">
                                <div class="font-semibold text-slate-800">${col.name}</div>
                                <div class="text-xs text-slate-400">${col.detail || '-'}</div>
                            </td>
                            <td class="p-4 text-center border-r border-slate-200">${statusBadge}</td>
                        </tr>
                    `;
                });
            }

            document.getElementById('student-result').classList.remove('hidden');
        }

        function fetchDataFromGAS() {
            if (!store.scriptUrl) return;
            fetch(`${store.scriptUrl}?action=getData`)
                .then(res => res.json())
                .then(data => {
                    if (data.students && data.students.length > 0) store.students = data.students;
                    if (data.assignments && data.assignments.length > 0) store.assignments = data.assignments;
                    if (data.taskColumns && data.taskColumns.length > 0) store.taskColumns = data.taskColumns;
                }).catch(err => console.log("FETCH ERROR", err));
        }
    </script>
</body>
</html>
