<!-- HOMEROOM VIEW (หน้าสรุปภาพรวมห้องสำหรับครูประจำชั้น) -->
<section id="sec-homeroom" class="hidden space-y-6">
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 flex flex-col md:flex-row justify-between items-center gap-4">
        <div>
            <h2 class="text-xl font-bold text-slate-800"><i class="fa-solid fa-chalkboard-user text-indigo-600 mr-2"></i>ภาพรวมงานค้างและสถานะนักเรียนประจำห้อง</h2>
            <p class="text-xs text-slate-500">ตรวจสอบรายชื่อนักเรียนที่ค้างส่งงาน และงานที่ไม่เรียบร้อยรายห้อง</p>
        </div>
        <div class="flex items-center gap-3 w-full md:w-auto">
            <select id="homeroom-class-select" onchange="renderHomeroomDashboard()" class="border border-slate-300 rounded-xl p-2.5 text-sm bg-white font-semibold text-indigo-700">
                <!-- ดึงห้องอัตโนมัติ -->
            </select>
            <button onclick="window.print()" class="text-xs bg-slate-100 hover:bg-slate-200 px-4 py-2.5 rounded-xl border text-slate-700 font-medium transition flex items-center gap-1">
                <i class="fa-solid fa-print"></i> พิมพ์รายงาน
            </button>
        </div>
    </div>

    <div class="bg-white rounded-2xl shadow-sm border border-slate-200 p-6 space-y-4">
        <div class="flex justify-between items-center border-b pb-4">
            <h3 class="font-bold text-slate-800 text-lg" id="homeroom-title">สรุปสถานะการส่งงานประจำห้อง</h3>
            <span class="text-xs bg-emerald-50 text-emerald-700 px-3 py-1.5 rounded-full font-semibold">
                <i class="fa-solid fa-circle-check mr-1"></i> เชื่อมโยงข้อมูลแบบ Real-time
            </span>
        </div>
        <div class="overflow-x-auto">
            <table class="w-full text-left border-collapse text-sm">
                <thead>
                    <tr class="border-b text-slate-500 bg-slate-50">
                        <th class="p-3 border-r border-slate-200 text-center w-24">รหัส</th>
                        <th class="p-3 border-r border-slate-200">ชื่อ - นามสกุล นักเรียน</th>
                        <th class="p-3 text-center border-r border-slate-200 w-28">งานทั้งหมด</th>
                        <th class="p-3 text-center border-r border-slate-200 w-28 text-emerald-600">ส่งแล้ว</th>
                        <th class="p-3 text-center border-r border-slate-200 w-32 text-amber-600">ไม่เรียบร้อย</th>
                        <th class="p-3 text-center border-r border-slate-200 w-28 text-rose-600">ค้างส่ง</th>
                        <th class="p-3 text-center w-36">สถานะภาพรวม</th>
                    </tr>
                </thead>
                <tbody id="homeroom-table-body">
                    <!-- ข้อมูลจะถูกเรนเดอร์อัตโนมัติผ่าน JavaScript -->
                </tbody>
            </table>
        </div>
    </div>
</section>
