<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบติดตามงานค้างนักเรียน - โรงเรียนยุวพุทธิศึกษาอุปถัมภ์</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Sarabun', sans-serif; }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-900 via-indigo-800 to-slate-900 min-h-screen text-slate-800 flex items-center justify-center p-4">

    <!-- Landing Page -->
    <div id="portal-screen" class="max-w-lg w-full bg-white/95 backdrop-blur-md p-8 rounded-3xl shadow-2xl text-center border border-white/20 my-auto">
        <div class="relative w-32 h-32 mx-auto mb-6 bg-indigo-50 rounded-full p-3 shadow-inner border-2 border-indigo-100 flex items-center justify-center">
            <i class="fa-solid fa-graduation-cap text-6xl text-indigo-600"></i>
        </div>
        <h1 class="text-2xl md:text-3xl font-bold text-slate-800 mb-2" id="portal-school-name">โรงเรียนยุวพุทธิศึกษาอุปถัมภ์</h1>
        <p class="text-indigo-600 font-semibold mb-8 text-sm md:text-base">ระบบติดตามงานค้างนักเรียน</p>

        <div class="space-y-4">
            <a href="student.html" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transition duration-200 flex items-center justify-center gap-3 text-lg">
                <i class="fa-solid fa-user-graduate text-2xl"></i>
                <span>เข้าสู่ระบบนักเรียน (ตรวจสอบงาน)</span>
            </a>
            <button onclick="openTeacherLoginModal()" class="w-full bg-gradient-to-r from-indigo-600 to-purple-600 hover:from-indigo-700 hover:to-purple-700 text-white font-bold py-4 px-6 rounded-2xl shadow-lg transition duration-200 flex items-center justify-center gap-3 text-lg">
                <i class="fa-solid fa-chalkboard-user text-2xl"></i>
                <span>เข้าสู่ระบบครู / แอดมิน</span>
            </button>
        </div>
        <p class="text-xs text-slate-400 mt-8" id="portal-footer">งานเทคโนโลยีสารสนเทศและการศึกษา © โรงเรียนยุวพุทธิศึกษาอุปถัมภ์</p>
    </div>

    <!-- Modal รหัสผ่านครู -->
    <div id="teacher-login-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl space-y-4">
            <div class="text-center">
                <i class="fa-solid fa-lock text-4xl text-indigo-600 mb-2"></i>
                <h3 class="text-xl font-bold text-slate-800">เข้าสู่ระบบครูผู้สอน</h3>
            </div>
            <form onsubmit="handleTeacherLogin(event)" class="space-y-3">
                <div class="relative">
                    <input type="password" id="teacher-pass-input" placeholder="กรอกรหัสผ่านครู" required class="w-full border border-slate-300 rounded-xl p-3 pr-10 text-sm text-center font-bold tracking-widest focus:ring-2 focus:ring-indigo-500">
                    <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600">
                        <i id="eye-icon" class="fa-solid fa-eye"></i>
                    </button>
                </div>
                <div class="flex justify-end gap-2 pt-2">
                    <button type="button" onclick="closeTeacherLoginModal()" class="px-4 py-2 rounded-xl text-slate-600 text-sm">ยกเลิก</button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 text-white rounded-xl text-sm font-medium shadow hover:bg-indigo-700">ยืนยัน</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Teacher Dashboard -->
    <div id="teacher-dashboard" class="hidden fixed inset-0 bg-slate-100 overflow-y-auto z-50">
        <header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
            <div class="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center space-x-3">
                    <button onclick="backToPortal()" class="bg-indigo-800 hover:bg-indigo-900 text-white px-3 py-1.5 rounded-xl text-xs font-semibold mr-2 flex items-center gap-1 transition">
                        <i class="fa-solid fa-arrow-left"></i> หน้าแรก
                    </button>
                    <i class="fa-solid fa-graduation-cap text-3xl text-yellow-300"></i>
                    <div>
                        <h1 class="text-xl font-bold" id="dashboard-school-title">ระบบจัดการและตรวจงานนักเรียน</h1>
                        <p class="text-xs text-indigo-200">โรงเรียนยุวพุทธิศึกษาอุปถัมภ์</p>
                    </div>
                </div>
                
                <div class="flex bg-indigo-800 p-1 rounded-xl text-sm font-medium flex-wrap justify-center gap-1">
                    <button onclick="switchTab('teacher')" id="tab-teacher" class="px-3 py-2 rounded-lg transition flex items-center gap-1.5 bg-white text-indigo-900 shadow font-semibold">
                        <i class="fa-solid fa-book-bookmark"></i> ตรวจงาน/สั่งงาน
                    </button>
                    <button onclick="switchTab('students')" id="tab-students" class="px-3 py-2 rounded-lg transition flex items-center gap-1.5 text-indigo-200 hover:text-white">
                        <i class="fa-solid fa-users-gear"></i> จัดการรายชื่อนักเรียน
                    </button>
                    <button onclick="switchTab('homeroom')" id="tab-homeroom" class="px-3 py-2 rounded-lg transition flex items-center gap-1.5 text-indigo-200 hover:text-white">
                        <i class="fa-solid fa-chalkboard-user"></i> สรุปภาพรวมห้อง
                    </button>
                    <button onclick="openAdminModal()"
